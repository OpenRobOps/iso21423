name: py-sdk

on:
  push:
    branches: [main]
    paths: ['py-sdk/**', 'ts-sdk/src/schema/**', '.github/workflows/py-sdk.yml']
  pull_request:
    paths: ['py-sdk/**', 'ts-sdk/src/schema/**', '.github/workflows/py-sdk.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: py-sdk

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        paho: ['paho-mqtt==1.6.1', 'paho-mqtt>=2,<3']
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports: ['1883:1883']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]' '${{ matrix.paho }}'
      - run: pip list | grep -i paho
      - name: Configure the broker (the image only listens on localhost by default)
        working-directory: .
        run: |
          printf 'listener 1883\nallow_anonymous true\n' > /tmp/mosquitto.conf
          docker cp /tmp/mosquitto.conf "$(docker ps -qf ancestor=eclipse-mosquitto:2)":/mosquitto/config/mosquitto.conf
          docker restart "$(docker ps -qf ancestor=eclipse-mosquitto:2)"
          # a TCP probe is not enough: docker-proxy accepts before mosquitto listens, so do an MQTT round trip
          for i in $(seq 30); do
            docker exec "$(docker ps -qf ancestor=eclipse-mosquitto:2)" \
              mosquitto_sub -h localhost -t '$SYS/broker/version' -C 1 -W 2 && break
            sleep 1
          done
      - run: pytest -m "not interop" -p no:cacheprovider -o addopts=""
        env:
          ISO21423_TEST_BROKER: mqtt://localhost:1883
