name: Publish py-sdk

# Tag py-sdk-vX.Y.Z (matching py-sdk/pyproject.toml) to publish `iso21423` to PyPI.
# PyPI trusts this workflow + the `pypi` environment (trusted publishing); no token is stored.
on:
  push:
    tags: ['py-sdk-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches pyproject version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "py-sdk-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != py-sdk-v$v"; exit 1; }
      - run: pip install build twine -e '.[test]'
      - run: pytest -p no:cacheprovider   # unit tests; broker suites run in py-sdk.yml
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: py-sdk/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
